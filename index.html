<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<body>
<!--ARTIFACT-START-->
<title>Celular Desmontável</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: tela cheia sobre uma "base de corte" verde quadriculada (1 quadrado = 1 cm),
     ferramentas embaixo, ficha da peça à direita (ou de baixo, no celular). */
  :root {
    --mat: #163830;
    --line: rgba(214, 240, 229, 0.06);
    --line-major: rgba(214, 240, 229, 0.13);
    --ink: #e9f2ed;
    --muted: #9db8ad;
    --faint: rgba(214, 240, 229, 0.16);
    --panel: rgba(12, 30, 26, 0.94);
    --edge: rgba(214, 240, 229, 0.14);
    --tape: #f2b03d;
    --tape-ink: #2a1a00;
    --s1: #f2b03d;
    --s2: #5fd4c0;
    --s3: #ff8a73;
    --s4: #8fb3ff;
    --s5: #d3a6ff;
    --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,0.35) 100%),
      linear-gradient(var(--line-major) 1px, transparent 1px) 0 0 / 120px 120px,
      linear-gradient(90deg, var(--line-major) 1px, transparent 1px) 0 0 / 120px 120px,
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 24px 24px,
      var(--mat);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  #stage canvas.over-part { cursor: pointer; }
  #stage canvas.dragging { cursor: grabbing; }

  .head {
    position: fixed; top: 0; left: 0; right: 0; pointer-events: none;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 4px;
  }
  .head h1 {
    margin: 0; font-family: var(--display); font-weight: 700;
    font-size: clamp(22px, 4vw, 30px); letter-spacing: 0.01em; text-wrap: balance;
  }
  .head p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 46ch; }
  .scale {
    position: fixed; pointer-events: none;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: 0.06em;
    display: flex; align-items: center; gap: 8px;
  }
  .scale i { display: block; width: 24px; height: 6px; border: 1px solid var(--muted); border-top: 0; }

  .tools {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 6px; padding: 6px;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px;
    backdrop-filter: blur(8px);
    max-width: calc(100% - 32px);
  }
  .tools button, .list button, .close, .tabs button {
    font: 600 14px/1 var(--display); letter-spacing: 0.03em; color: var(--ink);
    background: transparent; border: 1px solid transparent; border-radius: 9px;
    padding: 11px 14px; cursor: pointer; white-space: nowrap;
  }
  .tools button:hover { background: rgba(214,240,229,0.08); }
  .tools button.primary { background: var(--tape); color: var(--tape-ink); }
  .tools button.primary:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid var(--tape); outline-offset: 2px; }

  #tip {
    position: fixed; pointer-events: none; z-index: 5;
    font: 500 12px/1 var(--mono); padding: 6px 8px; border-radius: 6px;
    background: var(--tape); color: var(--tape-ink); transform: translate(14px, 14px);
  }

  .sheet {
    position: fixed; z-index: 4;
    top: calc(16px + env(safe-area-inset-top, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    width: min(400px, calc(100% - 32px));
    max-height: calc(100% - 120px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto; overscroll-behavior: contain;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px;
    backdrop-filter: blur(10px);
    padding: 18px 18px 20px;
    display: flex; flex-direction: column; gap: 12px;
    animation: rise .22s ease-out;
  }
  @keyframes rise { from { transform: translateY(8px); opacity: .6; } to { transform: none; opacity: 1; } }
  .sheet-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .cat { font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .sheet h2 { margin: 6px 0 0; font: 700 24px/1.1 var(--display); text-wrap: balance; }
  .sheet h3 { margin: 0; font: 600 17px/1.2 var(--display); letter-spacing: 0.02em; }
  .close { padding: 8px 10px; border-color: var(--edge); font-size: 13px; }
  .close:hover { background: rgba(214,240,229,0.08); }
  .sheet p { margin: 0; line-height: 1.55; color: var(--ink); }
  .spec { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; padding: 12px 0; border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); }
  .spec dt { font: 500 11px/1.6 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .spec dd { margin: 0; line-height: 1.45; min-width: 0; }
  .fact { display: flex; flex-direction: column; gap: 8px; }
  .tape {
    align-self: flex-start; font: 600 11px/1 var(--display); text-transform: uppercase; letter-spacing: 0.12em;
    background: var(--tape); color: var(--tape-ink); padding: 5px 10px 4px; transform: rotate(-1.5deg);
  }
  .fact p { color: var(--muted); }

  /* Gráfico de preço */
  .price { display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-top: 1px solid var(--edge); }
  .switch { display: flex; flex-wrap: wrap; gap: 6px; }
  .switch button {
    font: 500 12px/1 var(--mono); color: var(--muted); background: transparent; cursor: pointer;
    border: 1px solid var(--edge); border-radius: 999px; padding: 7px 10px;
  }
  .switch button[aria-pressed="true"] { background: var(--tape); border-color: var(--tape); color: var(--tape-ink); }
  .unit { font: 400 12px/1.4 var(--mono); color: var(--muted); }
  .tabs { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--edge); border-radius: 10px; align-self: flex-start; }
  .tabs button { padding: 8px 11px; font-size: 13px; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: rgba(214,240,229,0.12); color: var(--ink); }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
  .chart .grid { stroke: var(--faint); stroke-width: 1; }
  .chart .pt { cursor: pointer; }
  .chart .pt:focus-visible { outline: none; stroke: var(--ink); stroke-width: 2.5; }
  .chart .hit { fill: transparent; cursor: pointer; }
  .legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .legend li { display: flex; align-items: center; gap: 6px; font-size: 12.5px; min-width: 0; }
  .legend svg { flex: none; }
  .legend em { font-style: normal; color: var(--muted); font-size: 11.5px; }
  .readout {
    font-size: 13px; line-height: 1.5; padding: 10px 12px; border-radius: 10px;
    background: rgba(214,240,229,0.06); min-height: 1.5em;
  }
  .readout strong { font-weight: 600; }
  .readout a { color: var(--tape); }
  .readout .ex { color: var(--tape); font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; }
  .note { font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  .key { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 400 11.5px/1.4 var(--mono); color: var(--muted); }
  .key span { display: inline-flex; align-items: center; gap: 6px; }

  .list h2 { font-size: 20px; }
  .list ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .list ol button {
    width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    font: 500 14px/1.2 var(--body); letter-spacing: 0; padding: 10px;
  }
  .list ol button:hover { background: rgba(214,240,229,0.08); }
  .list ol span { font: 400 11px/1.3 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; text-align: right; }
  .list ol span b { color: var(--tape); font-weight: 500; }

  @media (max-width: 640px) {
    .head p { font-size: 12.5px; }
    .sheet {
      top: auto; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
      width: auto; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); max-height: 58%;
    }
    .scale { display: none; }
    .tools button { padding: 11px 12px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
</style>

<div id="stage" aria-label="Modelo 3D de um celular. Arraste as peças para desmontar; toque numa peça para ver o que ela é."></div>

<header class="head">
  <h1>Celular Desmontável</h1>
  <p>Arraste as peças para tirá-las do lugar. Toque numa peça para ver o que ela faz e quanto custa. Arraste o fundo para girar; use a pinça ou a roda do mouse para zoom.</p>
</header>

<div class="scale" aria-hidden="true"><i></i>1 cm</div>

<nav class="tools" aria-label="Ferramentas">
  <button id="btn-explode" class="primary" type="button">Desmontar tudo</button>
  <button id="btn-reset" type="button">Montar</button>
  <button id="btn-list" type="button">Peças</button>
  <button id="btn-prices" type="button">Preços</button>
</nav>

<div id="tip" hidden></div>

<aside id="info" class="sheet" hidden aria-live="polite">
  <div class="sheet-top">
    <div>
      <div class="cat" id="i-cat"></div>
      <h2 id="i-name"></h2>
    </div>
    <button class="close" id="i-close" type="button" aria-label="Fechar ficha">Fechar</button>
  </div>
  <p id="i-desc"></p>
  <section class="price" id="price" hidden>
    <div class="switch" id="p-switch" role="group" aria-label="Ver preço de outra peça"></div>
    <div>
      <h3 id="p-title"></h3>
      <div class="unit" id="p-unit"></div>
    </div>
    <div class="tabs" id="p-tabs" role="tablist" aria-label="Grupo de modelos"></div>
    <div class="chart" id="p-chart"></div>
    <ul class="legend" id="p-legend"></ul>
    <div class="key" id="p-key"></div>
    <div class="readout" id="p-read" aria-live="polite"></div>
    <p class="note" id="p-note"></p>
  </section>
  <dl class="spec">
    <dt>Função</dt><dd id="i-func"></dd>
    <dt>Material</dt><dd id="i-mat"></dd>
  </dl>
  <div class="fact">
    <span class="tape">Curiosidade</span>
    <p id="i-fact"></p>
  </div>
</aside>

<aside id="list" class="sheet list" hidden>
  <div class="sheet-top">
    <h2>Peças do aparelho</h2>
    <button class="close" id="l-close" type="button" aria-label="Fechar lista">Fechar</button>
  </div>
  <ol id="l-items"></ol>
</aside>

/* ---------- Ajudantes de geometria ---------- */
const v = (x, y, z) => new THREE.Vector3(x, y, z);
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0, ...o });
const mesh = (g, m) => new THREE.Mesh(g, m);

function rr(w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  const s = new THREE.Shape(), x = w / 2 - r, y = h / 2 - r;
  s.absarc(x, y, r, 0, Math.PI / 2);
  s.absarc(-x, y, r, Math.PI / 2, Math.PI);
  s.absarc(-x, -y, r, Math.PI, Math.PI * 1.5);
  s.absarc(x, -y, r, Math.PI * 1.5, Math.PI * 2);
  return s;
}
// Placa de cantos arredondados (opcionalmente com furo e borda chanfrada), centrada em z
function slab(w, h, r, d, o = {}) {
  const b = o.bevel || 0;
  const s = rr(w - 2 * b, h - 2 * b, Math.max(r - b, 0.01));
  if (o.hole) s.holes.push(rr(o.hole.w + 2 * b, o.hole.h + 2 * b, o.hole.r + b));
  const depth = Math.max(d - 2 * b, 0.001);
  const g = new THREE.ExtrudeGeometry(s, {
    depth, curveSegments: 28,
    bevelEnabled: b > 0, bevelSize: b, bevelThickness: b, bevelSegments: b > 0 ? 6 : 0,
  });
  g.translate(0, 0, -depth / 2);
  return g;
}
function cyl(r, len, color, o) {
  const m = mesh(new THREE.CylinderGeometry(r, r, len, 48), mat(color, o));
  m.rotation.x = Math.PI / 2;
  return m;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function roundPath(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function circuitBoard(w, h, seed, shields) {
  const g = new THREE.Group();
  const pcb = mesh(slab(w, h, 0.25, 0.08), new THREE.MeshStandardMaterial({ map: fitTex(pcbTexture(w, h), w, h), roughness: 0.5, metalness: 0.15 }));
  g.add(pcb);
  for (const [sx, sy, sw, sh] of shields) {
    const can = mesh(slab(sw, sh, 0.06, 0.1), mat(0xd2d6da, { metalness: 1, roughness: 0.42, bumpMap: repeatTex(noTex(noiseTexture(128, 128, 60)), 2, 2), bumpScale: 0.6 }));
    can.position.set(sx, sy, 0.09); g.add(can);
  }
  let s = seed;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 12; i++) {
    const cw = 0.08 + rnd() * 0.22, ch = 0.06 + rnd() * 0.18;
    const gold = rnd() < 0.25;
    const b = mesh(new THREE.BoxGeometry(cw, ch, 0.04), mat(gold ? 0xd0a64a : 0x1d2024, { metalness: gold ? 1 : 0.3, roughness: 0.35 }));
    b.position.set((rnd() - 0.5) * (w - 0.4), (rnd() - 0.5) * (h - 0.4), 0.06);
    g.add(b);
  }
  return g;
}

const noTex = (t) => { t.colorSpace = THREE.NoColorSpace; return t; };
const repeatTex = (t, u, v) => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(u, v); return t; };
// Ajusta a textura às coordenadas da peça (em cm), cobrindo a face inteira
const fitTex = (t, w, h) => { t.repeat.set(1 / w, 1 / h); t.offset.set(0.5, 0.5); return t; };
let seedN = 1;
const rand = () => (seedN = (seedN * 16807) % 2147483647) / 2147483647;

function brushedTexture() {
  return canvasTex(1024, 128, (g, w, h) => {
    g.fillStyle = '#9a9fa6'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 1400; i++) {
      const a = rand() * 0.1;
      g.fillStyle = rand() < 0.5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a})`;
      g.fillRect(rand() * w, rand() * h, 60 + rand() * 500, 1);
    }
  });
}
function noiseTexture(size, base, amp) {
  return canvasTex(size, size, (g, w, h) => {
    const img = g.createImageData(w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = base + (rand() - 0.5) * amp;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = n; img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
function pcbTexture(w, h) {
  const px = 170;
  return canvasTex(Math.round(w * px), Math.round(h * px), (g, W2, H2) => {
    const grd = g.createLinearGradient(0, 0, W2, H2);
    grd.addColorStop(0, '#1b4a33'); grd.addColorStop(1, '#123726');
    g.fillStyle = grd; g.fillRect(0, 0, W2, H2);
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (let i = 0; i < 90; i++) {
      let x = rand() * W2, y = rand() * H2;

      for (let k = 0; k < 3; k++) {
        const len = 20 + rand() * 140, d = Math.floor(rand() * 4);
        if (d === 0) x += len; else if (d === 1) y += len; else if (d === 2) { x += len * 0.7; y += len * 0.7; } else { x += len * 0.7; y -= len * 0.7; }
        g.lineTo(x, y);
      }
      g.stroke();
    }
    for (let i = 0; i < 160; i++) {
      const x = rand() * W2, y = rand() * H2;
      g.fillStyle = '#c9a24a'; g.beginPath(); g.arc(x, y, 3.2, 0, 7); g.fill();
      g.fillStyle = '#0d2a1c'; g.beginPath(); g.arc(x, y, 1.4, 0, 7); g.fill();
    }
    for (let i = 0; i < 70; i++) {
      const x = rand() * W2, y = rand() * H2, vert = rand() < 0.5;

      if (vert) { g.fillRect(x, y, 7, 9); g.fillRect(x, y + 15, 7, 9); } else { g.fillRect(x, y, 9, 7); g.fillRect(x + 15, y, 9, 7); }
    }
    g.strokeStyle = 'rgba(235,240,228,0.75)'; g.fillStyle = 'rgba(235,240,228,0.85)';
    g.lineWidth = 1.5; g.font = '600 13px ui-monospace, monospace';
    const pre = ['C', 'R', 'U', 'L', 'J', 'FL', 'TP'];
    for (let i = 0; i < 22; i++) {
      const x = rand() * (W2 - 60), y = 20 + rand() * (H2 - 30);
      g.fillText(pre[Math.floor(rand() * pre.length)] + Math.floor(1 + rand() * 480), x, y);
      if (rand() < 0.35) g.strokeRect(x - 4, y + 5, 28 + rand() * 50, 18 + rand() * 30);
    }

}
function chipTexture(w, h, lines) {
  const px = 260;
  return canvasTex(Math.round(w * px), Math.round(h * px), (g, W2, H2) => {
    g.fillStyle = '#16181b'; g.fillRect(0, 0, W2, H2);
    for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(255,255,255,${rand() * 0.035})`; g.fillRect(rand() * W2, rand() * H2, 2, 2); }
    g.fillStyle = '#6e757d'; g.textAlign = 'center';
    lines.forEach((t, i) => {
      g.font = `${i === 0 ? 600 : 400} ${Math.round(H2 / (i === 0 ? 7 : 10))}px ui-monospace, monospace`;
      g.fillText(t, W2 / 2, H2 * 0.38 + i * H2 * 0.16);
    });
    g.beginPath(); g.arc(W2 * 0.12, H2 * 0.14, H2 * 0.035, 0, 7); g.fill();
  });
}
function grilleTexture() {
  return canvasTex(256, 112, (g, w, h) => {
    g.fillStyle = '#2b2e33'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#0a0b0c';
    for (let y = 8; y < h; y += 12) for (let x = 8 + ((y / 12) % 2) * 6; x < w; x += 12) { g.beginPath(); g.arc(x, y, 3.4, 0, 7); g.fill(); }
  });
}
function backTextTexture() {

    g.fillText('Montado em São Paulo', w / 2, 138);

}

// Moldura: anel com perfil arredondado por fora e parede reta por dentro.
// Cada ponto do contorno recebe o mesmo perfil, empurrado para fora pela normal do contorno.
function frameGeometry(W, H, R, t, d, rr) {
  const wi = W / 2 - t, hi = H / 2 - t, ri = R - t, seg = 22;
  const path = [];
  for (const [cx, cy, a0] of [[wi - ri, hi - ri, 0], [-(wi - ri), hi - ri, Math.PI / 2], [-(wi - ri), -(hi - ri), Math.PI], [wi - ri, -(hi - ri), Math.PI * 1.5]]) {
    for (let k = 0; k <= seg; k++) {
      const a = a0 + (k / seg) * Math.PI / 2, nx = Math.cos(a), ny = Math.sin(a);
      path.push({ x: cx + nx * ri, y: cy + ny * ri, nx, ny });
    }
  }
  const h = d / 2, prof = [[0, h, 0, 1], [t - rr, h, 0, 1]];
  for (let k = 0; k <= 10; k++) { const a = Math.PI / 2 * (1 - k / 10); prof.push([t - rr + rr * Math.cos(a), h - rr + rr * Math.sin(a), Math.cos(a), Math.sin(a)]); }
  for (let k = 0; k <= 10; k++) { const a = -Math.PI / 2 * (k / 10); prof.push([t - rr + rr * Math.cos(a), -h + rr + rr * Math.sin(a), Math.cos(a), Math.sin(a)]); }
  prof.push([t - rr, -h, 0, -1], [0, -h, 0, -1], [0, -h, -1, 0], [0, h, -1, 0]);
  const N = path.length, M = prof.length, pos = [], nor = [], uv = [], idx = [];
  let len = 0;
  for (let i = 0; i <= N; i++) {
    const p = path[i % N];
    if (i > 0) { const q = path[i - 1]; len += Math.hypot(p.x - q.x, p.y - q.y); }
    for (let j = 0; j < M; j++) {
      const [o, z, no, nz] = prof[j];
      pos.push(p.x + p.nx * o, p.y + p.ny * o, z);
      nor.push(p.nx * no, p.ny * no, nz);
      uv.push(len / 5, j / (M - 1));
    }
  }
  for (let i = 0; i < N; i++) for (let j = 0; j < M - 1; j++) {
    const a = i * M + j, b = (i + 1) * M + j;
    idx.push(a, a + 1, b, b, a + 1, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

const parts = [];
const pickables = [];
function addPart(id, obj, home, explode) {
  const p = { id, obj, home: home.clone(), explode, info: INFO[id], goal: null };
  obj.position.copy(home);
  obj.traverse((m) => {
    if (!m.isMesh) return;
    m.userData.part = p;
    pickables.push(m);
    if (m.material.emissive) m.userData.base = m.material.emissive.clone();
  });
  scene.add(obj);
  parts.push(p);
  return p;
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
function frame() {
  const d = 30 * Math.max(1, 0.85 / camera.aspect);
  camera.position.copy(v(0.42, 0.2, 0.88).normalize().multiplyScalar(d));
  controls.update();
}
new ResizeObserver(resize).observe(stage);

/* ---------- Seleção, arraste e realce ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const tip = document.getElementById('tip');
const GLOW = new THREE.Color(0xf2b03d);

function setNdc(e) {
  const r = el.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
function pick(e) {
  setNdc(e); ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(pickables, false)[0] || null;
}
function paint() {
  for (const p of parts) {
    const k = p === selected ? 0.55 : p === hovered ? 0.22 : 0;
    p.obj.traverse((m) => {
      if (!m.isMesh || !m.userData.base) return;
      m.material.emissive.copy(m.userData.base).lerp(GLOW, k);
    });
  }
}
function onDown(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  pointerDown = { x: e.clientX, y: e.clientY };
  if (drag) return;
  const hit = pick(e);
  if (!hit) return;
  const p = hit.object.userData.part;
  const n = new THREE.Vector3(); camera.getWorldDirection(n);
  drag = { p, id: e.pointerId, moved: false,
    plane: new THREE.Plane().setFromNormalAndCoplanarPoint(n, hit.point),
    offset: p.obj.position.clone().sub(hit.point) };
  p.goal = null;
  controls.enabled = false;
  el.setPointerCapture(e.pointerId);
}
el.addEventListener('pointermove', (e) => {
  if (drag && e.pointerId === drag.id) {
    if (!drag.moved && Math.hypot(e.clientX - pointerDown.x, e.clientY - pointerDown.y) > 5) {
      drag.moved = true; el.classList.add('dragging'); tip.hidden = true;
    }
    if (drag.moved) {
      setNdc(e); ray.setFromCamera(ndc, camera);
      const pt = new THREE.Vector3();
      if (ray.ray.intersectPlane(drag.plane, pt)) drag.p.obj.position.copy(pt.add(drag.offset));
    }
    return;
  }
  if (e.pointerType !== 'mouse' || pointerDown) return;
  const hit = pick(e);
  const p = hit ? hit.object.userData.part : null;
  if (p !== hovered) { hovered = p; paint(); }
  el.classList.toggle('over-part', !!p);
  if (p) { tip.hidden = false; tip.textContent = p.info.nome; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; }
  else tip.hidden = true;
});
function onUp(e) {
  if (drag && e.pointerId === drag.id) {
    if (!drag.moved) select(drag.p);
    drag = null;
    controls.enabled = true;
    el.classList.remove('dragging');
  } else if (pointerDown && e.type === 'pointerup' &&
             Math.hypot(e.clientX - pointerDown.x, e.clientY - pointerDown.y) < 5 && !pick(e)) {
    select(null);
  }
  pointerDown = null;
}
el.addEventListener('pointerup', onUp);
el.addEventListener('pointercancel', onUp);
el.addEventListener('pointerleave', () => { if (!drag) { hovered = null; tip.hidden = true; paint(); } });

const info = document.getElementById('info'), list = document.getElementById('list');
const $ = (id) => document.getElementById(id);
function select(p) {
  selected = p; paint();
  if (!p) { info.hidden = true; return; }
  list.hidden = true;
  $('i-cat').textContent = p.info.cat;
  $('i-name').textContent = p.info.nome;
  $('i-desc').textContent = p.info.desc;
  $('i-func').textContent = p.info.func;
  $('i-mat').textContent = p.info.mat;
  $('i-fact').textContent = p.info.fato;
  showPrice(p.id);
  info.hidden = false;
  info.scrollTop = 0;
}
$('i-close').addEventListener('click', () => select(null));
$('l-close').addEventListener('click', () => { list.hidden = true; });

const items = $('l-items');
for (const p of [...parts].reverse()) {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.type = 'button';
  b.append(p.info.nome);
  const tag = document.createElement('span');
  tag.textContent = p.info.cat;
  if (PRECOS[p.id]) { const g = document.createElement('b'); g.textContent = ' · preços'; tag.append(g); }
  b.append(tag);
  b.addEventListener('click', () => { if (!exploded) explode(true); select(p); });
  li.appendChild(b); items.appendChild(li);
}
$('btn-list').addEventListener('click', () => { info.hidden = true; list.hidden = !list.hidden; });

/* =========================================================
   Gráfico de preço (SVG desenhado à mão)
   ========================================================= */
const SVGNS = 'http://www.w3.org/2000/svg';
const COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)'];
let priceView = 0;

function svgEl(tag, attrs, parent) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) {
    const val = attrs[k];
    // variáveis CSS só funcionam em fill/stroke via style, não como atributo
    if ((k === 'fill' || k === 'stroke') && String(val).startsWith('var(')) n.style[k] = val;
    else n.setAttribute(k, val);
  }
  if (parent) parent.appendChild(n);
  return n;
}
function niceStep(range) {
  const raw = range / 4, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function fmt(n) { return n.toLocaleString('pt-BR', { maximumFractionDigits: 1 }); }

const SHORT = { soc: 'Processador', ram: 'RAM', armazenamento: 'Armazenamento', tela: 'Tela', bateria: 'Bateria', camera: 'Câmeras' };
function openPrices(id) {
  const p = parts.find((q) => q.id === id);
  if (!exploded) explode(true);
  select(p);
  $('price').scrollIntoView({ block: 'start' });
}
$('btn-prices').addEventListener('click', () => openPrices(selected && PRECOS[selected.id] ? selected.id : 'soc'));

function showPrice(id) {
  const cfg = PRECOS[id];
  const box = $('price');
  if (!cfg) { box.hidden = true; return; }
  box.hidden = false;
  const sw = $('p-switch'); sw.replaceChildren();
  for (const k of Object.keys(PRECOS)) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = SHORT[k] || k;
    b.setAttribute('aria-pressed', String(k === id));
    b.addEventListener('click', () => openPrices(k));
    sw.appendChild(b);
  }
  $('p-title').textContent = cfg.titulo;
  $('p-unit').textContent = cfg.unidade;
  $('p-note').textContent = cfg.nota;
  if (priceView >= cfg.vistas.length) priceView = 0;
  const tabs = $('p-tabs');
  tabs.replaceChildren();
  tabs.hidden = cfg.vistas.length < 2;
  cfg.vistas.forEach((vw, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'tab'); b.textContent = vw.nome;
    b.setAttribute('aria-selected', String(i === priceView));
    b.addEventListener('click', () => { priceView = i; showPrice(id); });
    tabs.appendChild(b);
  });
  drawChart(cfg, cfg.vistas[priceView]);
}

function drawChart(cfg, view) {
  const box = $('p-chart'); box.replaceChildren();
  const Wd = 360, Ht = 220, m = { l: 40, r: 12, t: 12, b: 26 };
  const n = cfg.x.length;
  const vals = [];
  view.series.forEach((s) => s.pontos.forEach((p) => { if (p) vals.push(p.max ?? p.y, p.min ?? p.y); }));
  const hi = Math.max(...vals), step = niceStep(hi);
  const ymax = Math.ceil((hi * 1.05) / step) * step;
  const X = (i) => m.l + (i * (Wd - m.l - m.r)) / (n - 1);
  const Y = (y) => m.t + (1 - y / ymax) * (Ht - m.t - m.b);

  const svg = svgEl('svg', { viewBox: `0 0 ${Wd} ${Ht}`, role: 'img', 'aria-label': `${cfg.titulo}: ${view.nome}` }, box);
  for (let t = 0; t <= ymax + 1e-9; t += step) {
    svgEl('line', { x1: m.l, x2: Wd - m.r, y1: Y(t), y2: Y(t), class: 'grid' }, svg);
    const lab = svgEl('text', { x: m.l - 6, y: Y(t) + 3.5, 'text-anchor': 'end' }, svg);
    lab.textContent = fmt(t);
  }
  const every = n > 6 ? 2 : 1;
  cfg.x.forEach((lbl, i) => {
    if (i % every && i !== n - 1) return;
    const t = svgEl('text', { x: X(i), y: Ht - 8, 'text-anchor': 'middle' }, svg);
    t.textContent = lbl;
  });

  const pts = [];
  view.series.forEach((s, si) => {
    const color = COLORS[si % COLORS.length];
    // linhas: sólida entre dois dados publicados, tracejada se algum ponto for exemplo
    let prev = null;
    s.pontos.forEach((p, i) => {
      if (!p) { prev = null; return; }
      if (prev) {
        svgEl('line', { x1: X(prev.i), y1: Y(prev.p.y), x2: X(i), y2: Y(p.y), stroke: color, 'stroke-width': 2,
          'stroke-dasharray': prev.p.ex || p.ex ? '5 4' : 'none', 'stroke-linecap': 'round', opacity: prev.p.ex || p.ex ? 0.75 : 1 }, svg);
      }
      prev = { p, i };
    });
    s.pontos.forEach((p, i) => {
      if (!p) return;
      if (p.min != null && p.max != null) {
        svgEl('line', { x1: X(i), x2: X(i), y1: Y(p.min), y2: Y(p.max), stroke: color, 'stroke-width': 6, opacity: 0.28, 'stroke-linecap': 'round' }, svg);
      }
      pts.push({ s, si, p, i, color });
    });
  });
  // pontos por cima das linhas, com área de toque maior
  pts.forEach((d) => {
    const g = svgEl('g', { class: 'pt', tabindex: 0, role: 'button', 'aria-label': describe(cfg, d) }, svg);
    svgEl('circle', { cx: X(d.i), cy: Y(d.p.y), r: 11, class: 'hit' }, g);
    svgEl('circle', { cx: X(d.i), cy: Y(d.p.y), r: d.p.ex ? 3.6 : 4.2,
      fill: d.p.ex ? 'var(--mat)' : d.color, stroke: d.color, 'stroke-width': d.p.ex ? 1.6 : 0 }, g);
    const act = () => readout(cfg, d);
    g.addEventListener('click', act);
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
  });

  // legenda
  const leg = $('p-legend'); leg.replaceChildren();
  view.series.forEach((s, si) => {
    const color = COLORS[si % COLORS.length];
    const real = s.pontos.filter((p) => p && !p.ex).length, total = s.pontos.filter(Boolean).length;
    const li = document.createElement('li');
    const sw = svgEl('svg', { width: 22, height: 10, 'aria-hidden': 'true' });
    svgEl('line', { x1: 1, x2: 21, y1: 5, y2: 5, stroke: color, 'stroke-width': 2.5, 'stroke-dasharray': real === total ? 'none' : '5 3' }, sw);
    li.append(sw, s.nome);
    if (real < total) { const e2 = document.createElement('em'); e2.textContent = real ? '(parte exemplo)' : '(exemplo)'; li.append(e2); }
    leg.appendChild(li);
  });

  // chave de leitura
  const anyEx = pts.some((d) => d.p.ex), anyReal = pts.some((d) => !d.p.ex), anyRange = pts.some((d) => d.p.min != null);
  const keyBox = $('p-key'); keyBox.replaceChildren();
  const keyItem = (svgFn, label) => {
    const sp = document.createElement('span');
    const sw = svgEl('svg', { width: 12, height: 12, 'aria-hidden': 'true' }); svgFn(sw);
    sp.append(sw, label); keyBox.appendChild(sp);
  };
  if (anyReal) keyItem((s) => svgEl('circle', { cx: 6, cy: 6, r: 4, fill: 'var(--ink)' }, s), 'dado publicado');
  if (anyEx) keyItem((s) => svgEl('circle', { cx: 6, cy: 6, r: 3.5, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 1.5 }, s), 'valor de exemplo, não é preço real');
  if (anyRange) keyItem((s) => svgEl('line', { x1: 6, x2: 6, y1: 1, y2: 11, stroke: 'var(--ink)', 'stroke-width': 5, opacity: 0.35 }, s), 'faixa estimada');

  const rd = $('p-read');
  rd.textContent = 'Toque num ponto do gráfico para ver o valor e a fonte.';
}

function describe(cfg, d) {
  const val = d.p.ex ? `${fmt(d.p.y)} (exemplo)` : (d.p.txt || fmt(d.p.y));
  return `${d.s.nome}${d.p.m && !d.p.ex ? ', ' + d.p.m : ''}, ${cfg.x[d.i]}: ${val}`;
}
function readout(cfg, d) {
  const rd = $('p-read'); rd.replaceChildren();
  const title = document.createElement('strong');
  title.textContent = (d.p.m && !d.p.ex) ? d.p.m : d.s.nome;
  rd.append(title, ` · ${cfg.x[d.i]}`, document.createElement('br'));
  if (d.p.ex) {
    const tag = document.createElement('span'); tag.className = 'ex'; tag.textContent = 'Exemplo';
    rd.append(tag, ` ${fmt(d.p.y)}${d.p.m ? ' · ' + d.p.m : ''}. Valor ilustrativo, sem fonte.`);
    return;
  }
  rd.append(d.p.txt || fmt(d.p.y));
  const f = FONTES[d.p.f];
  if (f) {
    rd.append(document.createElement('br'), 'Fonte: ');
    const a = document.createElement('a'); a.href = f.u; a.target = '_blank'; a.rel = 'noopener'; a.textContent = f.t;
    rd.append(a);
  }
}

/* =========================================================
   Desmontar / montar e loop
   ========================================================= */
function explode(on) {
  exploded = on;
  for (const p of parts) p.goal = on ? p.home.clone().add(p.explode) : p.home.clone();
  $('btn-explode').textContent = on ? 'Desmontado' : 'Desmontar tudo';
}
$('btn-explode').addEventListener('click', () => explode(true));
$('btn-reset').addEventListener('click', () => explode(false));

renderer.setAnimationLoop(() => {
  for (const p of parts) {
    if (!p.goal) continue;
    p.obj.position.lerp(p.goal, reduceMotion ? 1 : 0.1);
    if (p.obj.position.distanceTo(p.goal) < 0.002) { p.obj.position.copy(p.goal); p.goal = null; }
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
