<title>Celular Desmontável</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: tela cheia sobre uma "base de corte" verde quadriculada (1 quadrado = 1 cm),
     ferramentas embaixo, ficha da peça à direita (ou de baixo, no celular). */
  :root {
    --mat: #163830;
    --mat-deep: #0f2823;
    --line: rgba(214, 240, 229, 0.06);
    --line-major: rgba(214, 240, 229, 0.13);
    --ink: #e9f2ed;
    --muted: #9db8ad;
    --panel: rgba(12, 30, 26, 0.92);
    --edge: rgba(214, 240, 229, 0.14);
    --tape: #f2b03d;
    --tape-ink: #2a1a00;
    --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,0.35) 100%),
      linear-gradient(var(--line-major) 1px, transparent 1px) 0 0 / 120px 120px,
      linear-gradient(90deg, var(--line-major) 1px, transparent 1px) 0 0 / 120px 120px,
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 24px 24px,
      var(--mat);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  #stage canvas.over-part { cursor: pointer; }
  #stage canvas.dragging { cursor: grabbing; }

  .head {
    position: fixed; top: 0; left: 0; right: 0; pointer-events: none;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 4px;
  }
  .head h1 {
    margin: 0; font-family: var(--display); font-weight: 700;
    font-size: clamp(22px, 4vw, 30px); letter-spacing: 0.01em; text-wrap: balance;
  }
  .head p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 46ch; }
  .scale {
    position: fixed; pointer-events: none;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: 0.06em;
    display: flex; align-items: center; gap: 8px;
  }
  .scale i { display: block; width: 24px; height: 6px; border: 1px solid var(--muted); border-top: 0; }

  .tools {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 6px; padding: 6px;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px;
    backdrop-filter: blur(8px);
    max-width: calc(100% - 32px);
  }
  .tools button, .list button, .close {
    font: 600 14px/1 var(--display); letter-spacing: 0.03em; color: var(--ink);
    background: transparent; border: 1px solid transparent; border-radius: 9px;
    padding: 11px 14px; cursor: pointer; white-space: nowrap;
  }
  .tools button:hover { background: rgba(214,240,229,0.08); }
  .tools button.primary { background: var(--tape); color: var(--tape-ink); }
  .tools button.primary:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid var(--tape); outline-offset: 2px; }

  #tip {
    position: fixed; pointer-events: none; z-index: 5;
    font: 500 12px/1 var(--mono); padding: 6px 8px; border-radius: 6px;
    background: var(--tape); color: var(--tape-ink); transform: translate(14px, 14px);
  }

  .sheet {
    position: fixed; z-index: 4;
    top: calc(16px + env(safe-area-inset-top, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    width: min(360px, calc(100% - 32px));
    max-height: calc(100% - 120px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px;
    backdrop-filter: blur(10px);
    padding: 18px 18px 20px;
    display: flex; flex-direction: column; gap: 12px;
    animation: rise .22s ease-out;
  }
  @keyframes rise { from { transform: translateY(8px); opacity: .6; } to { transform: none; opacity: 1; } }
  .sheet-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .cat {
    font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted);
  }
  .sheet h2 { margin: 6px 0 0; font: 700 24px/1.1 var(--display); text-wrap: balance; }
  .close { padding: 8px 10px; border-color: var(--edge); font-size: 13px; }
  .close:hover { background: rgba(214,240,229,0.08); }
  .sheet p { margin: 0; line-height: 1.55; color: var(--ink); }
  .spec { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; padding: 12px 0; border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); }
  .spec dt { font: 500 11px/1.6 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .spec dd { margin: 0; line-height: 1.45; min-width: 0; }
  .fact { display: flex; flex-direction: column; gap: 8px; }
  .tape {
    align-self: flex-start; font: 600 11px/1 var(--display); text-transform: uppercase; letter-spacing: 0.12em;
    background: var(--tape); color: var(--tape-ink); padding: 5px 10px 4px; transform: rotate(-1.5deg);
  }
  .fact p { color: var(--muted); }

  .list h2 { font-size: 20px; }
  .list ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .list ol button {
    width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 12px;
    font: 500 14px/1.2 var(--body); letter-spacing: 0; padding: 10px;
  }
  .list ol button:hover { background: rgba(214,240,229,0.08); }
  .list ol span { font: 400 11px/1.3 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  @media (max-width: 640px) {
    .head p { font-size: 12.5px; }
    .sheet {
      top: auto; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
      width: auto; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); max-height: 48%;
    }
    .scale { display: none; }
    .tools button { padding: 11px 12px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
</style>

<div id="stage" aria-label="Modelo 3D de um celular. Arraste as peças para desmontar; toque numa peça para ver o que ela é."></div>

  bobina: { nome: 'Bobina de carga sem fio', cat: 'Energia',

    fato: 'Muitos aparelhos novos usam eSIM, um chip soldado na placa que é configurado por software, e alguns já nem têm bandeja.' },

    desc: 'Os botões na lateral para aumentar e diminuir o som.',

    mat: 'Metal, apoiado em pequenos interruptores de cúpula.',
    fato: 'Embaixo de cada botão há uma pequena cúpula de metal que "estala" ao ser pressionada. É ela que dá a sensação de clique.' },
  energia: { nome: 'Botão de energia', cat: 'Controles',
    desc: 'O botão que liga, desliga e bloqueia a tela.',
    func: 'Ligar e desligar o aparelho e bloquear a tela.',

/* ---------- Cena ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const el = renderer.domElement;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x1a3a30, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(6, 12, 10);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 300);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Ajudantes de geometria ---------- */
const v = (x, y, z) => new THREE.Vector3(x, y, z);
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0, ...o });
const mesh = (g, m) => new THREE.Mesh(g, m);

function rr(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
// Placa de cantos arredondados, centrada em z, extrudada ao longo de z
function slab(w, h, r, d, hole) {
  const s = rr(w, h, r);
  if (hole) s.holes.push(rr(hole.w, hole.h, hole.r));
  const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: false, curveSegments: 20 });
  g.translate(0, 0, -d / 2);
  return g;
}
function cyl(r, len, color, o) {
  const m = mesh(new THREE.CylinderGeometry(r, r, len, 40), mat(color, o));
  m.rotation.x = Math.PI / 2;
  return m;
}
function circuitBoard(w, h, seed) {
  const g = new THREE.Group();
  g.add(mesh(slab(w, h, 0.25, 0.08), mat(0x1f5a3c, { roughness: 0.55 })));
  let s = seed;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 16; i++) {
    const cw = 0.12 + rnd() * 0.32, ch = 0.08 + rnd() * 0.28;
    const gold = rnd() < 0.3;
    const b = mesh(new THREE.BoxGeometry(cw, ch, 0.05), mat(gold ? 0xd0a64a : 0x1d2024, { metalness: gold ? 1 : 0.3, roughness: 0.35 }));
    b.position.set((rnd() - 0.5) * (w - 0.5), (rnd() - 0.5) * (h - 0.5), 0.065);
    g.add(b);
  }
  return g;
}
function screenTexture() {
  const c = document.createElement('canvas');
  c.width = 480; c.height = 1030;
  const g = c.getContext('2d');
  const round = (x, y, w, h, r) => {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  };
  round(0, 0, 480, 1030, 58); g.clip();
  const bg = g.createLinearGradient(0, 0, 480, 1030);
  bg.addColorStop(0, '#0e3b55'); bg.addColorStop(0.55, '#1b6a5c'); bg.addColorStop(1, '#e0a03c');
  g.fillStyle = bg; g.fillRect(0, 0, 480, 1030);
  g.fillStyle = 'rgba(255,255,255,0.92)';
  g.font = '600 26px system-ui, sans-serif'; g.fillText('9:41', 44, 58);
  g.font = '300 128px system-ui, sans-serif'; g.textAlign = 'center'; g.fillText('9:41', 240, 250);
  g.font = '400 26px system-ui, sans-serif'; g.fillText('sexta-feira, 30 de outubro', 240, 296);
  const hues = ['#f2b03d', '#7fd1b9', '#e86a5a', '#8fb8ff', '#ffffff', '#c6a1ff', '#5fd36d', '#ffd36b'];
  for (let i = 0; i < 12; i++) {
    const col = i % 4, row = Math.floor(i / 4);
    g.fillStyle = hues[i % hues.length]; g.globalAlpha = 0.85;
    round(52 + col * 102, 420 + row * 118, 72, 72, 18); g.fill();
  }
  g.globalAlpha = 0.25; g.fillStyle = '#ffffff';
  round(26, 860, 428, 112, 40); g.fill();
  g.globalAlpha = 0.9;
  for (let i = 0; i < 4; i++) { g.fillStyle = hues[(i + 3) % hues.length]; round(52 + i * 102, 880, 72, 72, 18); g.fill(); }
  g.globalAlpha = 1; g.fillStyle = '#000'; round(196, 22, 88, 26, 13); g.fill();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/* ---------- Peças ---------- */
const parts = [];

function addPart(id, obj, home, explode) {
  const p = { id, obj, home: home.clone(), explode, info: INFO[id], goal: null };
  obj.position.copy(home);
  obj.traverse((m) => {
    if (!m.isMesh) return;
    m.userData.part = p;
    pickables.push(m);
    if (m.material.emissive) m.userData.base = m.material.emissive.clone();
  });
  scene.add(obj);
  parts.push(p);
  return p;
}

/* ---------- Câmera e controles ---------- */
let pointerDown = null, drag = null, hovered = null, selected = null, exploded = false;

// O tratamento de clique/arraste das peças precisa rodar antes do OrbitControls.
el.addEventListener('pointerdown', onDown);
const controls = new OrbitControls(camera, el);
controls.enableDamping = true;
controls.minDistance = 8;
controls.maxDistance = 70;
controls.target.set(0, 0, 0);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
function frame() {
  const d = 28 * Math.max(1, 0.85 / camera.aspect);
  camera.position.copy(v(0.42, 0.2, 0.88).normalize().multiplyScalar(d));
  controls.update();
}
new ResizeObserver(resize).observe(stage);
resize(); frame();

/* ---------- Seleção, arraste e realce ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const tip = document.getElementById('tip');
const GLOW = new THREE.Color(0xf2b03d);

function setNdc(e) {
  const r = el.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
function pick(e) {
  setNdc(e); ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(pickables, false)[0] || null;
}
function paint() {
  for (const p of parts) {
    const k = p === selected ? 0.55 : p === hovered ? 0.22 : 0;
    p.obj.traverse((m) => {
      if (!m.isMesh || !m.userData.base) return;
      m.material.emissive.copy(m.userData.base).lerp(GLOW, k);
    });
  }
}
function onDown(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  pointerDown = { x: e.clientX, y: e.clientY };
  if (drag) return;
  const hit = pick(e);
  if (!hit) return;
  const p = hit.object.userData.part;
  const n = new THREE.Vector3(); camera.getWorldDirection(n);
  drag = { p, id: e.pointerId, moved: false,
    plane: new THREE.Plane().setFromNormalAndCoplanarPoint(n, hit.point),
    offset: p.obj.position.clone().sub(hit.point) };
  p.goal = null;
  controls.enabled = false;
  el.setPointerCapture(e.pointerId);
}
el.addEventListener('pointermove', (e) => {
  if (drag && e.pointerId === drag.id) {
    if (!drag.moved && Math.hypot(e.clientX - pointerDown.x, e.clientY - pointerDown.y) > 5) {
      drag.moved = true; el.classList.add('dragging'); tip.hidden = true;
    }
    if (drag.moved) {
      setNdc(e); ray.setFromCamera(ndc, camera);
      const pt = new THREE.Vector3();
      if (ray.ray.intersectPlane(drag.plane, pt)) drag.p.obj.position.copy(pt.add(drag.offset));
    }
    return;
  }
  if (e.pointerType !== 'mouse' || pointerDown) return;
  const hit = pick(e);
  const p = hit ? hit.object.userData.part : null;
  if (p !== hovered) { hovered = p; paint(); }
  el.classList.toggle('over-part', !!p);
  if (p) { tip.hidden = false; tip.textContent = p.info.nome; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; }
  else tip.hidden = true;
});
function onUp(e) {
  if (drag && e.pointerId === drag.id) {
    if (!drag.moved) select(drag.p);
    drag = null;
    controls.enabled = true;
    el.classList.remove('dragging');
  } else if (pointerDown && e.type === 'pointerup' &&
             Math.hypot(e.clientX - pointerDown.x, e.clientY - pointerDown.y) < 5 && !pick(e)) {
    select(null);
  }
  pointerDown = null;
}
el.addEventListener('pointerup', onUp);
el.addEventListener('pointercancel', onUp);
el.addEventListener('pointerleave', () => { if (!drag) { hovered = null; tip.hidden = true; paint(); } });

/* ---------- Ficha informativa ---------- */
const info = document.getElementById('info'), list = document.getElementById('list');
const $ = (id) => document.getElementById(id);
function select(p) {
  selected = p; paint();
  if (!p) { info.hidden = true; return; }
  list.hidden = true;
  $('i-cat').textContent = p.info.cat;
  $('i-name').textContent = p.info.nome;
  $('i-desc').textContent = p.info.desc;
  $('i-func').textContent = p.info.func;
  $('i-mat').textContent = p.info.mat;
  $('i-fact').textContent = p.info.fato;
  info.hidden = false;
  info.scrollTop = 0;
}
$('i-close').addEventListener('click', () => select(null));
$('l-close').addEventListener('click', () => { list.hidden = true; });

const items = $('l-items');
for (const p of [...parts].reverse()) {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = `${p.info.nome}<span>${p.info.cat}</span>`;
  b.addEventListener('click', () => { if (!exploded) explode(true); select(p); });
  li.appendChild(b); items.appendChild(li);
}
$('btn-list').addEventListener('click', () => { info.hidden = true; list.hidden = !list.hidden; });

/* ---------- Desmontar / montar ---------- */
function explode(on) {
  exploded = on;
  for (const p of parts) p.goal = on ? p.home.clone().add(p.explode) : p.home.clone();
  $('btn-explode').textContent = on ? 'Desmontado' : 'Desmontar tudo';
}
$('btn-explode').addEventListener('click', () => explode(true));
$('btn-reset').addEventListener('click', () => explode(false));

/* ---------- Loop ---------- */
renderer.setAnimationLoop(() => {
  for (const p of parts) {
    if (!p.goal) continue;
    p.obj.position.lerp(p.goal, reduceMotion ? 1 : 0.1);
    if (p.obj.position.distanceTo(p.goal) < 0.002) { p.obj.position.copy(p.goal); p.goal = null; }
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
